services:
    postgres:
        image: postgres:15-alpine
        restart: always
        env_file:
            - .env.prod
        ports:
            - "${POSTGRES_DB_PORT:-5432}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - ecommerce-network

    minio:
        image: minio/minio
        restart: always
        command: server /data --console-address ":9001"
        env_file:
            - .env.prod
        ports:
            - "${MINIO_API_PORT:-9000}:9000"
            - "${MINIO_UI_PORT:-9001}:9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - ecommerce-network

    api:
        image: ${DOCKERHUB_USERNAME}/ecommerce-api:${IMAGE_TAG:-latest}
        restart: always
        env_file:
            - .env.prod
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy
            minio:
                condition: service_healthy
        networks:
            - ecommerce-network

    web:
        image: ${DOCKERHUB_USERNAME}/ecommerce-web:${IMAGE_TAG:-latest}
        restart: always
        env_file:
            - .env.prod
        ports:
            - "3000:3000"
        depends_on:
            - api
        environment:
            - NODE_ENV=production
            - PORT=3000
        networks:
            - ecommerce-network

    admin:
        image: ${DOCKERHUB_USERNAME}/ecommerce-admin:${IMAGE_TAG:-latest}
        restart: always
        env_file:
            - .env.prod
        ports:
            - "3001:3000"
        depends_on:
            - api
        environment:
            - NODE_ENV=production
            - PORT=3000
        networks:
            - ecommerce-network

    seller:
        image: ${DOCKERHUB_USERNAME}/ecommerce-seller:${IMAGE_TAG:-latest}
        restart: always
        env_file:
            - .env.prod
        ports:
            - "3002:3000"
        depends_on:
            - api
        environment:
            - NODE_ENV=production
            - PORT=3000
        networks:
            - ecommerce-network

volumes:
    pgdata:
    minio_data:

networks:
    ecommerce-network:
        name: ecommerce-network
        driver: bridge
