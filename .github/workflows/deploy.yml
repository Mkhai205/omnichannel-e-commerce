name: Deploy API To VPS

on:
    push:
        branches:
            - main

jobs:
    build-and-push:
        name: Build And Push Docker Image
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push API image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/api/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-api:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-api:${{ github.sha }}

    deploy:
        name: Deploy To VPS
        runs-on: ubuntu-latest
        needs: build-and-push

        steps:
            - name: Deploy API container on VPS
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VPS_IP }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e
                      APP_DIR=~/omnichannel-e-commerce
                      cd "$APP_DIR"

                      echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
                      docker pull "${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-api:latest"

                      if command -v docker-compose >/dev/null 2>&1; then
                        docker-compose up -d --no-deps api
                      else
                        docker compose up -d --no-deps api
                      fi

                      docker image prune -f
